[package]
name = "dinput8-proxy"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "dinput8"
crate-type = ["cdylib"]

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_Security",
] }

[profile.release]
panic = "abort"
strip = true
